<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#03050d" />
  <meta name="color-scheme" content="dark" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ARISE" />
  <meta name="description" content="Private Solo Leveling style strength system." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <title>ARISE System — Personal Strength Quest</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/solo.css" />
</head>
<body>

  <!-- ===== SPLASH ===== -->
  <div id="splash" aria-hidden="true">
    <div class="splash-circle">
      <svg viewBox="-100 -100 200 200" class="magic-circle spin-slow">
        <use href="#svg-magic-circle"></use>
      </svg>
      <svg viewBox="-40 -40 80 80" class="splash-clover"><use href="#svg-clover"></use></svg>
    </div>
    <h1 class="splash-title">ARISE<span>SYSTEM</span></h1>
    <p class="splash-sub">[ SYSTEM ] Player detected. Loading quests…</p>
    <p class="splash-tap">Tap to ARISE</p>
  </div>

  <!-- ===== SHARED SVG SYMBOLS ===== -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <path id="svg-leaf" d="M0 0 C-5 -4 -15 -8 -14 -19 C-13 -28 -2 -29 0 -20 C2 -29 13 -28 14 -19 C15 -8 5 -4 0 0 Z"/>
      <g id="svg-clover" stroke-linejoin="round">
        <path d="M0 -34 L7 -7 L34 0 L7 7 L0 34 L-7 7 L-34 0 L-7 -7 Z" fill="#050b1c" stroke="#6cc4ff" stroke-width="1.6"/>
        <path d="M0 -16 L5 0 L0 16 L-5 0 Z" fill="#6cc4ff" stroke="none" opacity=".9"/>
        <circle r="3" fill="#fff" stroke="none"/>
      </g>
      <g id="svg-magic-circle" fill="none" stroke="currentColor" stroke-width="0.8">
        <circle r="96"/>
        <circle r="90" stroke-dasharray="2 4"/>
        <circle r="70"/>
        <circle r="64" stroke-dasharray="10 5"/>
        <polygon points="0,-64 37.6,51.8 -60.9,-19.8 60.9,-19.8 -37.6,51.8"/>
        <circle r="38"/>
        <path d="M0 -96 V-70 M0 96 V70 M-96 0 H-70 M96 0 H70 M-68 -68 L-50 -50 M68 -68 L50 -50 M-68 68 L-50 50 M68 68 L50 50"/>
      </g>
    </defs>
  </svg>

  <div id="app">

    <!-- ===== HEADER ===== -->
    <header id="topbar">
      <div class="topbar-inner">
        <button class="brand" data-action="goto" data-tab="quest" aria-label="Home">
          <svg viewBox="-34 -34 68 68" class="brand-clover"><use href="#svg-clover"></use></svg>
        </button>
        <div class="hud-mini" id="hud-mini" data-action="goto" data-tab="status" role="button" tabindex="0">
          <div class="hud-line">
            <span class="hud-rank" id="hud-rank">E</span>
            <span class="hud-name" id="hud-name">WARRIOR</span>
            <span class="hud-lv">LV <b id="hud-lv">1</b></span>
          </div>
          <div class="xpbar"><i id="hud-xpfill"></i></div>
        </div>
        <div class="streak-pill" id="hud-streak" title="Training streak">🔥 <b>0</b></div>
      </div>
    </header>

    <main id="view" tabindex="-1"></main>

  </div>

  <!-- ===== REST TIMER BAR ===== -->
  <div id="rest-bar" class="hidden" role="status">
    <div class="rest-info">
      <span class="rest-label">REST</span>
      <span class="rest-time" id="rest-time">0:00</span>
    </div>
    <div class="rest-progress"><i id="rest-fill"></i></div>
    <div class="rest-actions">
      <button data-action="rest-add" aria-label="Add 15 seconds">+15s</button>
      <button data-action="rest-skip" class="primary">Skip</button>
    </div>
  </div>

  <!-- ===== BOTTOM NAV ===== -->
  <nav id="nav" aria-label="Main">
    <button data-action="goto" data-tab="quest" class="active">
      <svg viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M4 9l2-2 3 3-2 2zM15 17l2-2 3 3-2 2zM17.5 6.5l-11 11"/></svg>
      <span>Quest</span>
    </button>
    <button data-action="goto" data-tab="rations">
      <svg viewBox="0 0 24 24"><path d="M5 11h14a0 0 0 0 1 0 0 7 7 0 0 1-7 7h0a7 7 0 0 1-7-7zM8 4c0 2 2 2 2 4M12 3c0 2 2 2 2 5"/></svg>
      <span>Rations</span>
    </button>
    <button data-action="goto" data-tab="status">
      <svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>
      <span>Status</span>
    </button>
    <button data-action="goto" data-tab="grimoire">
      <svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3zM5 17a3 3 0 0 1 3-3h11"/></svg>
      <span>Gate</span>
    </button>
    <button data-action="goto" data-tab="vault">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>
      <span>Vault</span>
    </button>
  </nav>

  <!-- ===== HOLD TIMER OVERLAY ===== -->
  <div id="hold-overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-label="Hold timer">
    <div class="hold-window">
      <p class="sys-tag" id="hold-tag">[ SYSTEM ] HOLD QUEST</p>
      <h2 id="hold-name">—</h2>
      <p id="hold-set" class="hold-set">Set 1</p>
      <div class="hold-ring">
        <svg viewBox="0 0 200 200">
          <circle class="ring-bg" cx="100" cy="100" r="88"/>
          <circle class="ring-fg" id="hold-ring-fg" cx="100" cy="100" r="88" stroke-dasharray="552.92" stroke-dashoffset="0"/>
        </svg>
        <div class="hold-count">
          <span id="hold-count">0</span>
          <small id="hold-phase">GET READY</small>
        </div>
      </div>
      <p id="hold-cue" class="hold-cue"></p>
      <div class="hold-actions">
        <button class="btn ghost" data-action="hold-cancel">Cancel</button>
        <button class="btn gold" data-action="hold-finish">Done early ✓</button>
      </div>
    </div>
  </div>

  <!-- ===== GENERIC MODAL ===== -->
  <div id="modal" class="overlay hidden" role="dialog" aria-modal="true">
    <div class="modal-window" id="modal-body"></div>
  </div>

  <div id="toasts" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
